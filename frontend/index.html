<!DOCTYPE html>
    <html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>snake</title>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
        <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH"
            crossorigin="anonymous"
        >
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&family=Teko:wght@500;600;700&display=swap" rel="stylesheet">
        <style>
            /* Reset CSS: Please avoid making changes here unless you know what you're doing :) */
            *,
            *::before,
            *::after {
                margin: 0;
                padding: 0;
                box-sizing: border-box;
            }
    
            html, body {
                width: 100%;
                height: 100%;
            }
    
            body {
                line-height: 1;
                font-family: Arial, sans-serif;
                background:
                    radial-gradient(circle at 10% 20%, rgba(56, 189, 248, 0.22), transparent 32%),
                    radial-gradient(circle at 85% 12%, rgba(34, 197, 94, 0.18), transparent 38%),
                    linear-gradient(160deg, #020617 0%, #0b1120 48%, #172554 100%),
                    url('./assets/fondo_duelo.png') center/cover no-repeat fixed;
                overflow: hidden;
            }

    
            ol, ul {
                list-style: none;
            }
    
            img, video {
                max-width: 100%;
                height: auto;
                display: block;
            }
    
            a {
                text-decoration: none;
                color: inherit;
            }

            #app-shell {
                width: 100%;
                height: 100%;
            }

            #game-frame {
                width: 100vw;
                height: 100vh;
                max-height: 100vh;
                border: 0;
                background: transparent;
                position: relative;
            }

            #game-container {
                width: 100%;
                height: 100%;
            }

            #localgame-hud {
                pointer-events: none;
                z-index: 5;
                height: 100%;
                padding: 0;
            }

            .hud-player-side {
                --player-accent: #F67D31;
                position: relative;
                width: clamp(140px, 14vw, 200px);
                min-height: clamp(240px, 34vh, 320px);
                padding: 18px 14px !important;
                background: rgba(8, 12, 28, 0.9);
                border: 1px solid rgba(255, 255, 255, 0.16);
                border-left: 4px solid var(--player-accent);
                border-radius: 16px;
                box-shadow:
                    0 0 0 1px rgba(255, 255, 255, 0.05) inset,
                    0 14px 36px rgba(0, 0, 0, 0.48),
                    0 0 22px rgba(246, 125, 49, 0.14);
                font-family: 'Montserrat', sans-serif;
                gap: 14px;
            }

            .hud-player-side::before {
                content: '';
                position: absolute;
                top: 8px;
                left: 8px;
                width: 20px;
                height: 20px;
                border-top: 2px solid rgba(253, 230, 138, 0.45);
                border-left: 2px solid rgba(253, 230, 138, 0.45);
                border-radius: 5px 0 0 0;
                pointer-events: none;
            }

            .hud-player-side::after {
                content: '';
                position: absolute;
                top: 10px;
                right: 10px;
                width: 10px;
                height: 10px;
                border-radius: 50%;
                background: var(--player-accent);
                box-shadow: 0 0 10px var(--player-accent);
                pointer-events: none;
            }

            .hud-chip {
                background: linear-gradient(180deg, rgba(17, 24, 39, 0.92), rgba(49, 12, 53, 0.88));
                border: 1px solid rgba(246, 125, 49, 0.45);
                border-radius: 14px;
                min-width: 180px;
                box-shadow: 0 8px 24px rgba(0, 0, 0, 0.35);
                font-family: 'Montserrat', sans-serif;
            }

            .hud-player-name {
                color: var(--player-accent);
                font-family: 'Montserrat', sans-serif;
                font-size: clamp(0.95rem, 1.6vw, 1.1rem);
                font-weight: 800;
                letter-spacing: 0.06em;
                line-height: 1.2;
                text-transform: uppercase;
                text-shadow: 0 1px 4px rgba(0, 0, 0, 0.55);
                padding-right: 16px;
            }

            .hud-title {
                font-size: clamp(1.9rem, 3vw, 2.6rem);
                font-weight: 800;
                line-height: 1;
                text-shadow: 0 2px 0 rgba(0, 0, 0, 0.6);
            }

            .hud-effect {
                font-family: 'Montserrat', sans-serif;
                font-size: clamp(0.75rem, 1.2vw, 0.9rem);
                font-weight: 700;
                color: #FDE68A;
                letter-spacing: 0.04em;
                min-height: 1.1em;
            }

            #hud-help {
                font-size: clamp(0.88rem, 1.2vw, 1.05rem);
                letter-spacing: 0.04em;
                color: #E2E8F0;
            }

            .hud-score-big {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                min-width: 76px;
                padding: 6px 16px;
                border-radius: 999px;
                background: linear-gradient(180deg, rgba(255, 255, 255, 0.1), rgba(0, 0, 0, 0.24));
                border: 1px solid rgba(246, 125, 49, 0.32);
                color: #FDE68A;
                font-family: 'Teko', sans-serif;
                font-size: clamp(2.8rem, 5vw, 4rem);
                font-weight: 700;
                line-height: 1;
                text-shadow: 0 0 14px rgba(253, 230, 138, 0.3);
            }

            .hud-hearts {
                display: inline-flex;
                align-items: center;
                justify-content: center;
                gap: 0.15em;
                padding: 6px 14px;
                border-radius: 999px;
                background: rgba(0, 0, 0, 0.3);
                border: 1px solid rgba(255, 255, 255, 0.12);
                font-size: clamp(1.2rem, 2vw, 1.55rem);
                letter-spacing: 0.08em;
            }

            #hud-left-player {
                position: absolute;
                left: 16px;
                top: 50%;
                transform: translateY(-50%);
            }

            #hud-right-player {
                position: absolute;
                right: 16px;
                top: 50%;
                transform: translateY(-50%);
            }

            #hud-help-wrap {
                position: absolute;
                top: 14px;
                left: 50%;
                transform: translateX(-50%);
            }

            @media (max-width: 992px) {
                .hud-player-side {
                    width: 138px;
                    min-height: 190px;
                }

                .hud-player-name {
                    font-size: clamp(0.85rem, 3vw, 1rem);
                }

                .hud-score-big {
                    font-size: clamp(2.2rem, 6vw, 3rem);
                }

                #hud-left-player {
                    left: 6px;
                }

                #hud-right-player {
                    right: 6px;
                }
            }

            @media (max-width: 768px) {
                .hud-player-side {
                    width: auto;
                    min-height: 0;
                    padding: 8px 12px !important;
                    border-radius: 12px;
                }

                .hud-score-big {
                    font-size: 2rem;
                }

                .hud-hearts {
                    font-size: 1.2rem;
                }

                #hud-left-player,
                #hud-right-player {
                    top: 12px;
                    transform: none;
                }
            }

            #game-container canvas {
                width: 100% !important;
                height: 100% !important;
                display: block;
                image-rendering: pixelated;
                image-rendering: crisp-edges;
            }

            @media (max-width: 768px) {
                #game-frame {
                    border-radius: 0 !important;
                }
            }

            .legal-footer {
                position: absolute;
                left: 0;
                right: 0;
                bottom: 0;
                z-index: 9999;
                padding: 0.75rem 1rem 1rem;
                pointer-events: auto;
            }

            .legal-footer .legal-links {
                display: inline-flex;
                justify-content: center;
                align-items: center;
                gap: 0.75rem;
                border-top: 1px solid rgba(255,255,255,0.12);
                padding-top: 0.75rem;
                opacity: 0.92;
                color: #e2e8f0;
                font-size: 0.95rem;
            }

            .legal-footer a {
                color: #7dd3fc;
                text-decoration: none;
                pointer-events: auto;
                transition: opacity 0.2s ease, transform 0.2s ease;
            }

            .legal-footer a:hover {
                opacity: 1;
                transform: translateY(-1px);
            }

            .legal-footer .separator {
                color: rgba(255,255,255,0.35);
            }
        </style>
    </head>
    <body>
        <main id="app-shell" class="container-fluid d-flex align-items-center justify-content-center p-0">
            <section id="game-frame" class="overflow-hidden">
                <header id="localgame-hud" class="position-absolute top-0 start-0 w-100 d-none">
                    <div id="hud-help-wrap" class="hud-chip px-3 py-2 text-light text-center shadow-sm d-flex flex-column gap-1">
                        <div id="hud-help" class="fw-semibold">WASD | Flechas - ESC: Menu</div>
                        <div id="hud-food-help" class="fw-semibold d-none"></div>
                    </div>

                    <div id="hud-left-player" class="hud-player-side d-flex flex-column justify-content-between text-center">
                        <div id="hud-j1-score" class="hud-player-name">J1</div>
                        <div id="hud-j1-score-big" class="hud-score-big">0</div>
                        <div id="hud-j1-lives" class="hud-hearts">&#10084;&#10084;&#10084;</div>
                        <div id="hud-j1-effect" class="hud-effect"></div>
                    </div>

                    <div id="hud-right-player" class="hud-player-side d-flex flex-column justify-content-between text-center">
                        <div id="hud-j2-score" class="hud-player-name">J2</div>
                        <div id="hud-j2-score-big" class="hud-score-big">0</div>
                        <div id="hud-j2-lives" class="hud-hearts">&#10084;&#10084;&#10084;</div>
                        <div id="hud-j2-effect" class="hud-effect"></div>
                    </div>
                </header>
                <div id="game-container"></div>

                <footer class="legal-footer text-center">
                    <div class="legal-links">
                        <a href="/aviso-legal.html" class="d-flex align-items-center gap-1">
                            <span>⚖️</span>
                            <span>Aviso Legal</span>
                        </a>
                        <span class="separator">•</span>
                        <a href="/proteccion-datos.html" class="d-flex align-items-center gap-1">
                            <span>🛡️</span>
                            <span>Protección de datos</span>
                        </a>
                    </div>
                </footer>
            </section>
        </main>
        <script type="module" src="./src/main.js"></script>
    </body>
    </html>
