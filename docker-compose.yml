services:
  backend:
    build: ./backend
    container_name: snake_backend
    volumes:
      - ./backend:/app
      - ./shared:/shared
      - backend_node_modules:/app/node_modules # Referencia al volumen nombrado
    ports:
      - "2567:2567"
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250

  frontend:
    build: ./frontend
    container_name: snake_frontend
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - frontend_node_modules:/app/node_modules # Referencia al volumen nombrado
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250
      - WATCHPACK_POLLING=true
    depends_on:
      - backend

# Definición de volúmenes nombrados
volumes:
  backend_node_modules:
  frontend_node_modules: