# Desarrollo local: backend + frontend (Vite). Sin Caddy; usa los puertos publicados.
#
# Backend: el puerto 2567 está publicado para probar Colyseus desde el host (cliente en
# ws://localhost:2567). En producción con docker-compose.prod.yml suele bastar el acceso
# interno backend:2567 vía Caddy y puedes comentar "ports" aquí si no necesitas depuración.

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: development
    container_name: snake_backend
    volumes:
      - ./backend:/app/backend
      - ./shared:/app/shared
      - ${FIREBASE_SERVICE_ACCOUNT_FILE:-./snake-multijugador-firebase-adminsdk-fbsvc-77269dde1b.json}:/app/secrets/firebase-service-account.json:ro
      - backend_node_modules:/app/backend/node_modules
    ports:
      - "2567:2567"
    environment:
      - NODE_ENV=development
      - FIREBASE_SERVICE_ACCOUNT_PATH=/app/secrets/firebase-service-account.json
      - GOOGLE_APPLICATION_CREDENTIALS=/app/secrets/firebase-service-account.json
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250

  frontend:
    build: ./frontend
    container_name: snake_frontend
    volumes:
      - ./frontend:/app
      - ./shared:/shared
      - frontend_node_modules:/app/node_modules
    ports:
      - "5173:5173"
    environment:
      - CHOKIDAR_USEPOLLING=true
      - CHOKIDAR_INTERVAL=250
      - WATCHPACK_POLLING=true
      - VITE_API_PROXY_TARGET=http://backend:2567
    depends_on:
      - backend

volumes:
  backend_node_modules:
  frontend_node_modules:
